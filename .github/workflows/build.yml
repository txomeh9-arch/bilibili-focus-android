name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Optional previous build run ID: verify and publish its retained APKs'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free space on the temporary GitHub runner
        if: ${{ !inputs.artifact_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          if [[ "${ANDROID_HOME:-}" == /usr/local/lib/android/sdk ]]; then
            sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images"
          fi
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          if (( available_kib < 18 * 1024 * 1024 )); then
            echo 'Insufficient disk space for the Android build.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        if: ${{ !inputs.artifact_run_id }}
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Install Linux dependencies for Flutter tests
        if: ${{ !inputs.artifact_run_id }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev pkg-config
      - name: Apply upstream Android patches and resolve dependencies
        if: ${{ !inputs.artifact_run_id }}
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Analyze application
        if: ${{ !inputs.artifact_run_id }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib
      - name: Run focus policy tests
        if: ${{ !inputs.artifact_run_id }}
        run: flutter test test/focus_policy_test.dart
      - name: Configure release signing
        if: ${{ !inputs.artifact_run_id }}
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SIGNING_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "Missing signing secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/focus.p12
          {
            printf 'storeFile=focus.p12\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          [[ $(wc -l < android/key.properties) -eq 4 ]]
          keytool -list -keystore android/app/focus.p12 -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
      - name: Generate version metadata
        if: ${{ !inputs.artifact_run_id }}
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Build signed APKs
        if: ${{ !inputs.artifact_run_id }}
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --build-number "$GITHUB_RUN_NUMBER" --no-pub
      - name: Apply the fixed APK signature
        if: ${{ !inputs.artifact_run_id }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          [[ ${#apks[@]} -eq 3 ]]
          for apk in "${apks[@]}"; do
            "$build_tools/apksigner" sign --ks android/app/focus.p12 \
              --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD "$apk"
          done
      - name: Preserve APKs for diagnosis
        if: ${{ !inputs.artifact_run_id }}
        uses: actions/upload-artifact@v7
        with:
          name: unverified-diagnostic-apks-${{ github.run_number }}
          retention-days: 1
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-*-release.apk
      - name: Restore previously compiled APKs
        if: ${{ inputs.artifact_run_id }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          [[ $(jq -r '.path' <<< "$metadata") == '.github/workflows/build.yml' ]]
          [[ $(jq -r '.status' <<< "$metadata") == 'completed' ]]
          source_number=$(jq -r '.run_number' <<< "$metadata")
          source_sha=$(jq -r '.head_sha' <<< "$metadata")
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "unverified-diagnostic-apks-$source_number" \
            --dir build/app/outputs/flutter-apk
          printf 'Verifying APKs compiled from %s in run %s\n' "$source_sha" "$SOURCE_RUN_ID"
          printf 'APKs compiled from commit `%s` in [run %s](%s).\n' \
            "$source_sha" "$SOURCE_RUN_ID" "$(jq -r '.html_url' <<< "$metadata")" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$metadata" | jq '{source_commit: .head_sha, source_run: .html_url}' \
            > build/app/outputs/flutter-apk/BUILD_SOURCE.json
      - name: Verify APK signature and package
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [[ ${#apks[@]} -ne 3 ]]; then
            echo "Expected three APKs, found ${#apks[@]}." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying $apk"
            if ! signature=$("$build_tools/apksigner" verify --verbose --print-certs "$apk" 2>&1); then
              printf '%s\n' "$signature" >&2
              exit 1
            fi
            printf '%s\n' "$signature"
            actual=$(printf '%s\n' "$signature" | sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\1/p' | tr '[:upper:]' '[:lower:]' | sort -u)
            if [[ -z "$actual" || "${actual,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
              echo 'APK signing certificate does not match the configured key.' >&2
              exit 1
            fi
            badging=$("$build_tools/aapt" dump badging "$apk")
            if [[ "$badging" != *"package: name='io.github.txomeh9.bilifocus'"* ]]; then
              echo 'APK package name does not match the expected application ID.' >&2
              printf '%s\n' "$badging" | head -n 1 >&2
              exit 1
            fi
          done
          if [[ ! -f build/app/outputs/flutter-apk/BUILD_SOURCE.json ]]; then
            jq -n --arg sha "$GITHUB_SHA" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{source_commit: $sha, source_run: $url}' > build/app/outputs/flutter-apk/BUILD_SOURCE.json
          fi
          (cd build/app/outputs/flutter-apk && sha256sum app-*-release.apk > SHA256SUMS)
      - name: Upload signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: bilibili-focus-android-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
            build/app/outputs/flutter-apk/BUILD_SOURCE.json
